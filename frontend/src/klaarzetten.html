<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only dark">

<link rel="stylesheet" href="basis.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1424">
<link rel="icon" href="icoon-192.png?v=sunarc">

<style>
  /*
   * Klaarzetten per niveau (besluit 246, schets Wand-Klaarzetten): het laatste
   * deel van Inrichten. Per niveau de functies, elk met hoe ver hij is; rechts
   * de stappen van de gekozen functie. Op de telefoon de lijst, en de stappen
   * in een blad van onderen.
   */
  #wand main { position: relative; display: flex; flex-direction: column; gap: 14px; height: 100%; min-height: 0; }
  .terugje { font-size: 14px; font-weight: 600; color: var(--zacht); text-decoration: none; }
  .kopregel { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
  .kopregel .lead { margin-top: 6px; max-width: 60ch; }
  /* Het niveau: een balk met drie, elk met hoeveel er klaar is. */
  .niveaus { display: flex; gap: 6px; padding: 4px; border-radius: 18px; background: rgb(var(--wit) / 0.06); }
  .niveaus a { display: flex; flex-direction: column; gap: 2px; min-width: 150px; padding: 9px 16px; border-radius: 14px; text-decoration: none; color: var(--zacht); }
  .niveaus a b { font-size: 15px; font-weight: 700; color: inherit; display: flex; align-items: center; gap: 7px; }
  .niveaus a span { font-size: 12.5px; color: var(--gedempt); }
  .niveaus a[aria-current='page'] { background: rgb(var(--wit) / 0.13); color: var(--tekst); }
  .niveaus a[aria-current='page'] span { color: var(--zacht); }
  .niveaus i { width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--wit) / 0.25); }
  .niveaus i.half { background: var(--zon); }
  .niveaus i.klaar { background: var(--mint); }
  .niveaus a:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .veld { flex: 1; min-height: 0; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; }
  /* Links: de functies van dit niveau. */
  .functies { padding: 12px; display: flex; flex-direction: column; gap: 4px; min-height: 0; overflow: auto; }
  .functie { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 0 12px; align-items: center; padding: 7px 12px; border-radius: 18px; border: 1.5px solid transparent; text-decoration: none; color: inherit; }
  .functie .ik { grid-column: 1; grid-row: 1 / span 2; width: 38px; height: 38px; border-radius: 14px; display: grid; place-items: center; background: rgb(var(--wit) / 0.06); }
  .functie .ik svg { width: 22px; height: 22px; }
  .functie b { grid-column: 2; grid-row: 1; font-size: 15px; font-weight: 600; }
  .functie span.zin { grid-column: 2; grid-row: 2; font-size: 12.5px; color: var(--gedempt); }
  .functie .kz-ring { grid-column: 3; grid-row: 1 / span 2; }
  .functie.open { background: rgb(var(--wit) / 0.08); border-color: rgb(var(--wit) / 0.16); }
  .functie.klaar span.zin { color: var(--mint-t); }
  .functie.half span.zin { color: var(--zon-t); }
  .functie:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .functies .onder { margin: auto 0 0; padding: 10px 6px 2px; font-size: 13px; color: var(--gedempt); line-height: 1.45; }
  /* Rechts: de stappen van de gekozen functie. */
  .stappen { padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow: auto; }
  .stappen .boven { display: flex; align-items: start; justify-content: space-between; gap: 20px; }
  .stappen h2 { margin: 0; font-family: var(--kop); font-size: 28px; font-weight: 600; }
  .stappen .wat { margin: 4px 0 0; font-size: 14.5px; color: var(--zacht); line-height: 1.45; max-width: 62ch; }
  .stand { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .stand.half { color: var(--zon-t); background: rgba(247, 181, 72, 0.12); }
  .stand.klaar { color: var(--mint-t); background: rgba(110, 231, 183, 0.1); }
  .let { margin: auto 0 0; display: flex; gap: 12px; align-items: start; padding: 12px 14px; border-radius: 16px; background: rgb(var(--wit) / 0.04); font-size: 13.5px; color: var(--zacht); line-height: 1.45; }
  .let b { color: var(--tekst); }
  .let svg { flex: none; width: 22px; height: 22px; }
  /* De cloud: drie routes naast elkaar, elk met wat het kost en hoe je begint. */
  .routes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .route { display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; border-radius: 20px; background: rgb(var(--wit) / 0.045); border: 1.5px solid transparent; }
  .route.gekozen { border-color: rgba(143, 134, 255, 0.55); background: rgba(143, 134, 255, 0.08); }
  .route h3 { margin: 0; font-family: var(--kop); font-size: 19px; font-weight: 600; }
  .route p { margin: 0; font-size: 13.5px; color: var(--zacht); line-height: 1.45; }
  .route dl { margin: 4px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
  .route dt { color: var(--gedempt); }
  .route dd { margin: 0; color: var(--tekst); }
  .route .kz-doe { margin-top: auto; align-self: flex-start; }
  .route.gekozen .kz-doe.ha { background: var(--violet); color: #0b1424; }
  .route.gekozen .kz-doe.naar::after { color: inherit; }
  /* De telefoon: de lijst, en de stappen in een blad van onderen. */
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  #tel .niveaus a { min-width: 0; flex: 1; padding: 8px 10px; align-items: center; text-align: center; }
  #tel .niveaus a b { font-size: 14px; }
  #tel .niveaus i { display: none; }
  #tel .functies { padding: 6px; gap: 0; }
  #tel .functie { padding: 10px; border-radius: 14px; }
  #tel .stappen { position: fixed; left: 8px; right: 8px; bottom: 8px; max-height: 86vh; border-radius: 26px; z-index: 30; padding: 18px 16px 20px; background: rgb(var(--nacht) / 0.97); }
  #tel .stappen[hidden] { display: none; }
  #tel .stappen .boven { flex-direction: column; gap: 8px; padding-right: 40px; }
  #tel .stappen h2 { font-size: 24px; }
  #tel .routes { grid-template-columns: 1fr; }
  .sluit { display: none; }
  #tel .sluit { display: block; position: absolute; right: 14px; top: 14px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgb(var(--wit) / 0.08); color: var(--tekst); font-size: 18px; cursor: pointer; }
  .achter { position: fixed; inset: 0; background: rgba(4, 8, 16, 0.55); z-index: 29; }
  .achter[hidden] { display: none; }
</style>
</head>
<body class="lucht lucht-dag">
  <div id="wand" class="wand">
    <nav class="balk" id="balk" data-t-aria-label="nav.hoofdmenu"></nav>
    <main>
      <a class="terugje" href="instellingen.html" data-t="jij.terugInstellingen"></a>
      <div class="kopregel">
        <div><h1 class="kop-1" data-t="kz.kop"></h1><p class="lead" data-t="kz.lead"></p></div>
        <nav class="niveaus" data-t-aria-label="kz.niveau" data-niveaus></nav>
      </div>
      <div class="veld">
        <section class="glas functies" data-functies></section>
        <section class="glas stappen" data-stappen aria-live="polite"></section>
      </div>
    </main>
  </div>

  <div id="tel" class="tel">
    <div class="inhoud">
      <a class="terugje" href="instellingen.html" data-t="jij.terugInstellingen"></a>
      <h1 class="kop-1" style="font-size: 32px" data-t="kz.kop"></h1>
      <p class="lead" style="margin: -6px 0 0" data-t="kz.leadKort"></p>
      <nav class="niveaus" data-t-aria-label="kz.niveau" data-niveaus></nav>
      <section class="glas functies" data-functies></section>
    </div>
    <div class="achter" data-achter hidden></div>
    <section class="glas stappen" role="dialog" data-stappen hidden></section>
    <nav class="tabs" id="tabs" data-t-aria-label="nav.hoofdmenu"></nav>
  </div>
  <script src="kit/iconen.js"></script>
  <script src="kit/teksten.nl.js"></script>
  <script src="kit/teksten.en.js"></script>
  <script src="kit/taal.js"></script>
  <script src="kit/nav.js"></script>
  <script src="basis.js"></script>
  <script src="klaarstappen.js"></script>
  <script src="klaarzetten.js"></script>
</body>
</html>
